name: Build & Release (Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar dependências de áudio (ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Compilar binário Linux
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/fuoda.sh-linux-amd64 ./cmd/fuoda.sh
          chmod +x dist/fuoda.sh-linux-amd64

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: fuoda.sh-linux-amd64
          path: dist/fuoda.sh-linux-amd64

  release:
    name: Publicar GitHub Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar artefato Linux
        uses: actions/download-artifact@v4
        with:
          name: fuoda.sh-linux-amd64
          path: artifacts

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/fuoda.sh-linux-amd64
          generate_release_notes: true