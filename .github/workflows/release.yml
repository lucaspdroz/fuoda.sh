name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: fuoda.sh-linux-amd64
          - target: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: fuoda.sh-darwin-arm64
          - target: macos-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: fuoda.sh-darwin-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar dependências de áudio (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Compilar binário
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.artifact }} ./cmd/fuoda.sh
          chmod +x dist/${{ matrix.artifact }}

      - name: Assinar binário (macOS)
        if: matrix.goos == 'darwin'
        run: |
          codesign -s - -f dist/${{ matrix.artifact }}

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Criar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar Release com os binários
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true